name: Novel Downloader
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} | {1}', inputs.mode, inputs.mode == 'search' && inputs.keyword || inputs.novel_id) || 'Unit tests' }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: '第1次选 search 搜索候选；第2次选 download 下载选中目录。详见 README'
        type: choice
        options: [search, download]
        default: search
        required: true
      keyword:
        description: '仅 search 填：书名/作者/拼音（如 三体）；结果在日志及 candidates.json'
        type: string
        required: false
      novel_id:
        description: '仅 download 填完整目录URL：/11/11549/ 或 /11/11549/index_1.html；不可填纯数字或章节URL'
        type: string
        required: false
      workers:
        description: '仅 download 生效；并发下载线程数，建议 5（范围 1～64）'
        type: string
        default: '5'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate input
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
        run: |
          if [ "$MODE" = search ] && [ -z "$KEYWORD" ]; then echo '搜索模式需要 keyword'; exit 1; fi
          if [ "$MODE" = download ] && [ -z "$BOOK_URL" ]; then echo '下载模式需要完整目录 URL'; exit 1; fi
      - name: Search or download
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
          WORKERS: ${{ inputs.workers }}
        run: |
          if [ "$MODE" = search ]; then
            python novel_downloader.py --search "$KEYWORD"
          else
            python novel_downloader.py "$BOOK_URL" --workers "$WORKERS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-results
          path: |
            *.zip
            *.report.json
            candidates.json
          if-no-files-found: warn

  chapter_probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Probe one real chapter (metadata only)
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          root = 'https://www.xbiquge.info/11/11549/index_1.html'
          s = requests.Session()
          s.headers['User-Agent'] = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36'
          for url in [root]:
              try:
                  response = s.get(url, timeout=20)
                  print('CATALOG',response.status_code,response.url,'bytes',len(response.content),'title',BeautifulSoup(response.text,'lxml').title,flush=True)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.content,'lxml')
                  chapters = [urljoin(url,a['href']) for a in soup.select('a[href]') if re.fullmatch(r'/11/11549/[0-9]+\.html', urlparse(urljoin(url,a['href'])).path)]
                  print('CHAPTER_LINKS',len(chapters),flush=True)
                  if not chapters: raise RuntimeError('No chapter links detected')
                  chapter_url = chapters[0]
                  response = s.get(chapter_url, timeout=20)
                  response.raise_for_status()
                  print('CHAPTER',response.status_code,response.url,'bytes',len(response.content),'ctype',response.headers.get('Content-Type'),flush=True)
                  page = BeautifulSoup(response.content,'lxml')
                  print('TITLE',page.title.get_text(' ',strip=True)[:160] if page.title else None,flush=True)
                  for sel in ['#content','#chaptercontent','.read-content','.content','#txt','#article','#BookText','.txt','article','main','div[id*=content]']:
                      node=page.select_one(sel)
                      print('SELECTOR',sel,'length',len(node.get_text(' ',strip=True)) if node else 'missing',flush=True)
                  print('LARGE_TEXT_ELEMENTS',[(x.name,x.get('id'),x.get('class'),len(x.get_text(' ',strip=True))) for x in sorted(page.select('div,article,main,section'),key=lambda n:len(n.get_text(' ',strip=True)),reverse=True)[:8]],flush=True)
              except Exception as exc:
                  print('PROBE_ERROR',type(exc).__name__,str(exc)[:500],flush=True)
                  raise
          PY
