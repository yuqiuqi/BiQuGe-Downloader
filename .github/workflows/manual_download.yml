name: Novel Downloader
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} | {1}', inputs.mode, inputs.mode == 'search' && inputs.keyword || inputs.novel_id) || 'Unit tests' }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: '第1次选 search 搜索候选；第2次选 download 下载选中目录。详见 README'
        type: choice
        options: [search, download]
        default: search
        required: true
      keyword:
        description: '仅 search 填：书名/作者/拼音（如 三体）；结果在日志及 candidates.json'
        type: string
        required: false
      novel_id:
        description: '仅 download 填完整目录URL：/11/11549/ 或 /11/11549/index_1.html；不可填纯数字或章节URL'
        type: string
        required: false
      workers:
        description: '仅 download 生效；并发下载线程数，建议 5（范围 1～64）'
        type: string
        default: '5'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate input
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
        run: |
          if [ "$MODE" = search ] && [ -z "$KEYWORD" ]; then echo '搜索模式需要 keyword'; exit 1; fi
          if [ "$MODE" = download ] && [ -z "$BOOK_URL" ]; then echo '下载模式需要完整目录 URL'; exit 1; fi
      - name: Search or download
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
          WORKERS: ${{ inputs.workers }}
        run: |
          if [ "$MODE" = search ]; then
            python novel_downloader.py --search "$KEYWORD"
          else
            python novel_downloader.py "$BOOK_URL" --workers "$WORKERS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-results
          path: |
            *.zip
            *.report.json
            candidates.json
          if-no-files-found: warn



  chapter_probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xbiquge-live-chapter-selector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test actual fixed chapter() against live website
        run: |
          python - <<'PY'
          import requests
          from bqg_api import chapter
          urls = [
              'https://www.xbiquge.info/11/11549/1163959.html',
              'https://www.xbiquge.info/11/11549/1163958.html',
          ]
          with requests.Session() as session:
              session.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
              for url in urls:
                  try:
                      text = chapter(session, url)
                      print('CHAPTER_EXTRACTION_SUCCESS',url,'characters',len(text),flush=True)
                  except Exception as exc:
                      print('CHAPTER_EXTRACTION_FAILED',url,type(exc).__name__,str(exc)[:240],flush=True)
                      raise
          PY
