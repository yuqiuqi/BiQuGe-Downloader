name: Novel Downloader
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [search, download]
        required: true
      keyword:
        description: '书名、作者或拼音'
        type: string
        required: false
      novel_id:
        description: '选中的新站目录 URL'
        type: string
        required: false
      workers:
        type: string
        default: '5'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate input
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
        run: |
          if [ "$MODE" = search ] && [ -z "$KEYWORD" ]; then echo '搜索模式需要 keyword'; exit 1; fi
          if [ "$MODE" = download ] && [ -z "$BOOK_URL" ]; then echo '下载模式需要完整目录 URL'; exit 1; fi
      - name: Search or download
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          BOOK_URL: ${{ inputs.novel_id }}
          WORKERS: ${{ inputs.workers }}
        run: |
          if [ "$MODE" = search ]; then
            python novel_downloader.py --search "$KEYWORD"
          else
            python novel_downloader.py "$BOOK_URL" --workers "$WORKERS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-results
          path: |
            *.zip
            *.report.json
            candidates.json
          if-no-files-found: warn
